name: 🔄 Daily Profile Refresh

on:
  schedule:
    # Runs every day at 4:17 AM UTC (9:47 AM IST)
    - cron: "17 4 * * *"
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: profile-output
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎨 Generate assets
        run: |
          python scripts/build_assets.py

      - name: ✅ Verify README
        run: |
          python scripts/verify_readme.py

      - name: 📤 Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate assets [skip ci]"
            git push origin main
          fi

      - name: 📊 Workflow status
        if: always()
        run: |
          echo "✅ Daily refresh completed"
          echo "Assets regenerated and committed to main branch"
