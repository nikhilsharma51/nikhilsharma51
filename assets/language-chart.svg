<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 180" width="830" height="180">
    
    <style>
        :root {
            --accent: #58A6FF;
            --accent-deep: #003D99;
            --accent-soft: #3399FF;
            --bg: #0D1117;
            --surface: #161B22;
            --ink: #C9D1D9;
            --muted: #8B949E;
            --grid: #30363D;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --accent: #0066CC;
                --accent-deep: #003D99;
                --accent-soft: #3399FF;
                --bg: #FFFFFF;
                --surface: #F6F8FA;
                --ink: #24292F;
                --muted: #57606A;
                --grid: #D0D7DE;
            }
        }
    </style>
    
    <style>
        .chart-bg { fill: var(--bg); }
        .chart-label { font-family: system-ui, sans-serif; font-size: 14px; fill: var(--ink); font-weight: 600; }
        .chart-bar { fill: var(--accent); animation: grow 1s ease-out forwards; }
        .bar-1 { --bar-width: 85%; }
        .bar-2 { --bar-width: 75%; }
        .bar-3 { --bar-width: 80%; }
        @keyframes grow {
            from { width: 0%; }
            to { width: var(--bar-width); }
        }
        .tech-text { font-family: system-ui, sans-serif; font-size: 12px; fill: var(--muted); }
    </style>
    
    <!-- Background -->
    <rect class="chart-bg" width="830" height="180"/>
    
    <!-- Chart Title -->
    <text class="chart-label" x="20" y="25">Tech Stack Distribution</text>
    
    <!-- Bars -->
    <!-- Frontend -->
    <text class="chart-label" x="20" y="65">Frontend</text>
    <rect class="chart-bar bar-1" x="200" y="40" height="20" fill="#0066CC" rx="3" style="width: var(--bar-width);"/>
    <text class="tech-text" x="710" y="55">6 items</text>
    <!-- Backend -->
    <text class="chart-label" x="20" y="120">Backend</text>
    <rect class="chart-bar bar-2" x="200" y="95" height="20" fill="#3399FF" rx="3" style="width: var(--bar-width);"/>
    <text class="tech-text" x="710" y="110">6 items</text>
    <!-- AI/ML -->
    <text class="chart-label" x="20" y="175">AI/ML</text>
    <rect class="chart-bar bar-3" x="200" y="150" height="20" fill="#003D99" rx="3" style="width: var(--bar-width);"/>
    <text class="tech-text" x="710" y="165">5 items</text>
</svg>